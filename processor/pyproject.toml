[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-neuro-processor"
version = "0.1.1"
description = "Cluster-side Scaling Neuro DICOM EPI processor"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "pydicom==3.0.1"]

[project.scripts]
scaling-neuro-processor = "scaling_neuro_processor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scaling_neuro_processor*"]
