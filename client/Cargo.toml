[package]
name = "neuro-sync"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
description = "Functional EPI DICOM sync client for Scaling Neuro"
license = "Apache-2.0"
repository = "https://github.com/SophontAI/scalingneuro"
publish = false

[[bin]]
name = "neuro-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dicom-core = "0.9"
dicom-encoding = "0.9"
dicom-object = "0.9"
dicom-parser = "0.9"
dicom-transfer-syntax-registry = "0.9"
directories = "6.0"
flate2 = "1.1"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tar = "0.4"
terminal_size = "0.4.4"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.17", features = ["serde", "v4"] }
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
