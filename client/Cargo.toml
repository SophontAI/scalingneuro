[package]
name = "neuro-sync"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Privacy-first functional MRI contribution client for Scaling Neuro"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SophontAI/scalingneuro"
publish = false

[[bin]]
name = "neuro-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dicom-core = "0.9"
dicom-object = "0.9"
directories = "6.0"
flate2 = "1.1"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.17", features = ["serde", "v4"] }
walkdir = "2.5"
webbrowser = "1.0"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
