name: Release EPI sync client

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact client version from client/Cargo.toml
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: neuro-sync-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' client/Cargo.toml | head -1)
          [[ "$source_version" == "${{ inputs.version }}" ]]
          echo "value=$source_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: cargo fmt --manifest-path client/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path client/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path client/Cargo.toml
      - run: npm run check --prefix worker

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            targets: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl-static
            archive: tar
          - os: macos-14
            target: aarch64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            platform: macos-universal
            archive: zip
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux static toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.targets }}
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C target-feature=+crt-static' || '' }}
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path client/Cargo.toml --target "${{ matrix.target }}"
          if [[ "${{ matrix.platform }}" == "macos-universal" ]]; then
            cargo build --locked --release --manifest-path client/Cargo.toml --target x86_64-apple-darwin
          fi
      - name: Verify the dependency-free Linux client
        if: runner.os == 'Linux'
        run: ./scripts/verify-static-linux.sh client/target/x86_64-unknown-linux-musl/release/neuro-sync "${{ needs.validate.outputs.version }}"
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          root="neuro-sync-v${VERSION}-${PLATFORM}"
          mkdir -p "release/$root"
          if [[ "$PLATFORM" == "macos-universal" ]]; then
            lipo -create \
              client/target/aarch64-apple-darwin/release/neuro-sync \
              client/target/x86_64-apple-darwin/release/neuro-sync \
              -output "release/$root/neuro-sync"
            chmod 0755 "release/$root/neuro-sync"
          elif [[ "$PLATFORM" == windows-* ]]; then
            cp "client/target/$TARGET/release/neuro-sync.exe" "release/$root/"
          else
            cp "client/target/$TARGET/release/neuro-sync" "release/$root/"
            chmod 0755 "release/$root/neuro-sync"
          fi
          cp LICENSE-APACHE LICENSE-MIT "release/$root/"
          if [[ "$ARCHIVE" == tar ]]; then
            tar -C release -czf "release/$root.tar.gz" "$root"
          else
            (cd release && 7z a -tzip "$root.zip" "$root" >/dev/null)
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: release/neuro-sync-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Build release index and verified installers
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mac="neuro-sync-v${VERSION}-macos-universal.zip"
          linux="neuro-sync-v${VERSION}-linux-x86_64-musl-static.tar.gz"
          windows="neuro-sync-v${VERSION}-windows-x86_64.zip"
          mac_sha=$(sha256sum "release/$mac" | cut -d' ' -f1)
          linux_sha=$(sha256sum "release/$linux" | cut -d' ' -f1)
          windows_sha=$(sha256sum "release/$windows" | cut -d' ' -f1)
          ./scripts/render-installers.sh \
            release "$VERSION" "https://scalingneuro.com/downloads" \
            "$mac" "$mac_sha" "$linux" "$linux_sha" "$windows" "$windows_sha"
          jq -n \
            --arg version "$VERSION" \
            --arg mac "$mac" --arg mac_sha "$mac_sha" \
            --arg linux "$linux" --arg linux_sha "$linux_sha" \
            --arg windows "$windows" --arg windows_sha "$windows_sha" \
            '{
              schema_version: "2.0.0",
              version: $version,
              artifacts: {
                macos: {url: ("/downloads/" + $mac), sha256: $mac_sha},
                linux: {url: ("/downloads/" + $linux), sha256: $linux_sha},
                windows: {url: ("/downloads/" + $windows), sha256: $windows_sha}
              },
              installers: {
                unix: {url: "/install.sh"},
                windows: {url: "/install.ps1"}
              }
            }' > release/latest.json
          (cd release && sha256sum neuro-sync-* install.sh install.ps1 latest.json > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "client-v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "neuro-sync $VERSION" \
            --notes "Functional EPI DICOM sync client."
