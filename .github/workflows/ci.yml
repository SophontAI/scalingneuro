name: Ingestion CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Schemas and metadata policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: schemas/requirements.txt

      - name: Install schema validator
        run: python -m pip install --requirement schemas/requirements.txt

      - name: Validate schemas, examples, and policy paths
        run: python schemas/validate.py

  client:
    name: Rust client
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect client component
        id: component
        shell: bash
        run: |
          if [[ -f client/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "client/Cargo.toml is not present; client checks are intentionally skipped."
          fi

      - name: Install Rust toolchain
        if: steps.component.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Rust build
        if: steps.component.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Check formatting
        if: steps.component.outputs.present == 'true'
        run: cargo fmt --manifest-path client/Cargo.toml --all -- --check

      - name: Lint
        if: steps.component.outputs.present == 'true'
        run: cargo clippy --locked --manifest-path client/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.component.outputs.present == 'true'
        run: cargo test --locked --manifest-path client/Cargo.toml --all-features

  installer-unix:
    name: Terminal installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Test verified user-level installation and tamper rejection
        run: ./scripts/test-installers.sh

  installer-windows:
    name: Terminal installer (Windows)
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Test verified user-level installation and tamper rejection
        shell: pwsh
        run: ./scripts/test-installers.ps1

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect Worker component
        id: component
        shell: bash
        run: |
          if [[ -f worker/package.json && -f worker/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "worker package and lockfile are not both present; Worker checks are intentionally skipped."
          fi

      - name: Set up Node
        if: steps.component.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked dependencies
        if: steps.component.outputs.present == 'true'
        run: npm ci --prefix worker

      - name: Compile and validate public schemas with strict Ajv
        if: steps.component.outputs.present == 'true'
        run: node schemas/validate-ajv.mjs

      - name: Type-check
        if: steps.component.outputs.present == 'true'
        run: npm run typecheck --prefix worker

      - name: Test
        if: steps.component.outputs.present == 'true'
        run: npm test --prefix worker

      - name: Test browser data streaming
        if: steps.component.outputs.present == 'true'
        run: node --test tests/*.test.mjs
