name: Ingestion CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Schemas and metadata policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            schemas/requirements.txt
            scripts/vendor-dicom-qa-requirements.txt

      - name: Install schema and vendor-QA validators
        run: |
          python -m pip install --requirement schemas/requirements.txt
          python -m pip install --require-hashes --requirement scripts/vendor-dicom-qa-requirements.txt

      - name: Validate schemas, examples, and policy paths
        run: |
          python schemas/validate.py
          python scripts/test_vendor_dicom_qa.py
          python scripts/vendor_dicom_qa.py --self-test

  client:
    name: Rust client
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Detect client component
        id: component
        shell: bash
        run: |
          if [[ -f client/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "client/Cargo.toml is not present; client checks are intentionally skipped."
          fi

      - name: Install Rust toolchain
        if: steps.component.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Rust build
        if: steps.component.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Check formatting
        if: steps.component.outputs.present == 'true'
        run: cargo fmt --manifest-path client/Cargo.toml --all -- --check

      - name: Lint
        if: steps.component.outputs.present == 'true'
        run: cargo clippy --locked --manifest-path client/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.component.outputs.present == 'true'
        run: cargo test --locked --manifest-path client/Cargo.toml --all-features

  client-linux-static:
    name: Static Linux x86_64 client
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install musl and ELF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools

      - name: Install Rust musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          shared-key: linux-x86_64-musl-static

      - name: Build and prove the public static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path client/Cargo.toml --target x86_64-unknown-linux-musl
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' client/Cargo.toml | head -1)
          ./scripts/verify-static-linux.sh client/target/x86_64-unknown-linux-musl/release/neuro-sync "$version"

  installer-unix:
    name: Terminal installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Test verified user-level installation and tamper rejection
        run: ./scripts/test-installers.sh

  installer-windows:
    name: Windows ACL and terminal installer
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Verify private Windows state ACLs
        run: cargo test --locked --manifest-path client/Cargo.toml privacy::tests::windows_restrictions_remove_inheritance_and_other_accounts

      - name: Test verified user-level installation and tamper rejection
        shell: pwsh
        run: ./scripts/test-installers.ps1

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Test exact production Pages configuration gate
        run: ./scripts/test-configure-pages-production.sh

      - name: Test two-phase production download preservation
        run: |
          ./scripts/test-production-downloads.sh
          ./scripts/test-release-cutover.sh

      - name: Detect Worker component
        id: component
        shell: bash
        run: |
          if [[ -f worker/package.json && -f worker/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "worker package and lockfile are not both present; Worker checks are intentionally skipped."
          fi

      - name: Set up Node
        if: steps.component.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install locked dependencies
        if: steps.component.outputs.present == 'true'
        run: npm ci --prefix worker

      - name: Compile and validate public schemas with strict Ajv
        if: steps.component.outputs.present == 'true'
        run: node schemas/validate-ajv.mjs

      - name: Type-check
        if: steps.component.outputs.present == 'true'
        run: npm run typecheck --prefix worker

      - name: Test
        if: steps.component.outputs.present == 'true'
        run: npm test --prefix worker

  processor:
    name: Cluster processor
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: processor/requirements.lock

      - name: Install locked processor dependencies
        run: python -m pip install --require-hashes --requirement processor/requirements.lock

      - name: Test processor contracts and pipelines
        run: PYTHONPATH=processor python -m unittest discover -v -s processor/tests
