name: Validate and deploy EPI archive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: scaling-neuro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.scope.outputs.full_validation }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        name: Choose validation scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "full_validation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "full_validation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site_only=true
          changed_count=0
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            changed_count=$((changed_count + 1))
            case "$path" in
              index.html|404.html|styles.css|app.js|favicon.svg|og.png|docs/contribution-policy.html|downloads/index.html)
                ;;
              *)
                site_only=false
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          if [[ "$changed_count" -gt 0 && "$site_only" == "true" ]]; then
            echo "full_validation=false" >> "$GITHUB_OUTPUT"
          else
            echo "full_validation=true" >> "$GITHUB_OUTPUT"
          fi

  validate-site:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - name: Build and validate the website
        run: |
          ./scripts/test-workflow-triggers.sh
          ./scripts/build-site.sh
          node --check app.js
          node --check dist/_worker.js
          git diff --check

  validate:
    name: Validate website, service, and client
    needs: classify
    if: needs.classify.outputs.full_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: schemas/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement schemas/requirements.txt
          npm ci --prefix worker
      - name: Validate deployment boundaries and schemas
        run: |
          ./scripts/test-workflow-triggers.sh
          ./scripts/test-configure-pages-production.sh
          python schemas/validate.py
          node schemas/validate-ajv.mjs
      - name: Validate the EPI sync client
        run: |
          cargo fmt --manifest-path client/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path client/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path client/Cargo.toml --all-features
      - name: Validate the archive service
        run: npm run check --prefix worker

  validate-unix-installers:
    name: Validate installer on ${{ matrix.os }}
    needs: classify
    if: needs.classify.outputs.full_validation == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/test-installers.sh

  validate-windows:
    name: Validate Windows privacy and installer
    needs: classify
    if: needs.classify.outputs.full_validation == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Verify private local state permissions
        run: cargo test --locked --manifest-path client/Cargo.toml privacy::tests::windows_restrictions_remove_inheritance_and_other_accounts
      - name: Verify the Windows installer
        shell: pwsh
        run: ./scripts/test-installers.ps1

  deploy:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.classify.result == 'success' &&
      needs.validate-site.result == 'success' &&
      (
        needs.classify.outputs.full_validation != 'true' ||
        (
          needs.validate.result == 'success' &&
          needs.validate-unix-installers.result == 'success' &&
          needs.validate-windows.result == 'success'
        )
      )
    needs: [classify, validate-site, validate, validate-unix-installers, validate-windows]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scalingneuro.org
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - name: Enforce production bindings and isolated previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/configure-pages-production.sh
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --prefix worker -- wrangler d1 migrations apply scaling-neuro-control --remote --config worker/wrangler.jsonc
      - name: Build the site and Worker
        run: ./scripts/build-site.sh
      - name: Restore the latest verified client release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' client/Cargo.toml | head -1)
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // ""')
          [[ "$tag" == "client-v${source_version}" ]] || {
            echo "Latest client release ${tag:-<none>} does not match source version ${source_version}." >&2
            echo "Publish client-v${source_version}, then rerun this deployment." >&2
            exit 1
          }
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          gh release download "$tag" --dir "$release_dir"
          (cd "$release_dir" && sha256sum --check --strict SHA256SUMS)
          find "$release_dir" -mindepth 1 -maxdepth 1 -type f \
            ! -name 'install.sh' ! -name 'install.ps1' -exec install -m 0644 {} dist/downloads/ \;
          install -m 0755 "$release_dir/install.sh" dist/install.sh
          install -m 0644 "$release_dir/install.ps1" dist/install.ps1
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=scalingneuro --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the deployed source
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            health=$(curl --fail --silent --show-error --max-time 15 https://scalingneuro.org/health || true)
            version=$(curl --fail --silent --show-error --max-time 15 https://scalingneuro.org/version.json || true)
            if jq --exit-status '.status == "ok"' <<<"$health" >/dev/null 2>&1 &&
               jq --exit-status --arg sha "$GITHUB_SHA" '.commit == $sha' <<<"$version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not converge to the deployed source version" >&2
          exit 1
