name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: scalingneuro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scalingneuro.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: schemas/requirements.txt
      - name: Validate the site and service
        run: |
          python -m pip install --requirement schemas/requirements.txt
          npm ci --prefix worker
          python schemas/validate.py
          node schemas/validate-ajv.mjs
          npm run check --prefix worker
      - name: Enforce production bindings and isolated previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/configure-pages-production.sh
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --prefix worker -- wrangler d1 migrations apply scaling-neuro-control --remote --config worker/wrangler.jsonc
      - name: Build the site and Worker
        run: ./scripts/build-site.sh
      - name: Restore the latest verified client release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' client/Cargo.toml | head -1)
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // ""')
          [[ "$tag" == "client-v${source_version}" ]] || {
            echo "Latest client release ${tag:-<none>} does not match source version ${source_version}." >&2
            echo "Publish client-v${source_version}, then rerun this deployment." >&2
            exit 1
          }
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          gh release download "$tag" --dir "$release_dir"
          (cd "$release_dir" && sha256sum --check --strict SHA256SUMS)
          find "$release_dir" -mindepth 1 -maxdepth 1 -type f \
            ! -name 'install.sh' ! -name 'install.ps1' -exec install -m 0644 {} dist/downloads/ \;
          install -m 0755 "$release_dir/install.sh" dist/install.sh
          install -m 0644 "$release_dir/install.ps1" dist/install.ps1
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=scalingneuro --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the deployed source
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            health=$(curl --fail --silent --show-error --max-time 15 https://scalingneuro.com/health || true)
            version=$(curl --fail --silent --show-error --max-time 15 https://scalingneuro.com/version.json || true)
            if jq --exit-status '.status == "ok"' <<<"$health" >/dev/null 2>&1 &&
               jq --exit-status --arg sha "$GITHUB_SHA" '.commit == $sha' <<<"$version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not converge to the deployed source version" >&2
          exit 1
